# XcodeGen-Spezifikation für MailPilot (iOS 17 / macOS 14).
#   brew install xcodegen
#   cd apps/apple && xcodegen generate     → MailPilot.xcodeproj (nicht eingecheckt)
# Bundle-ID, Team-ID, App Group und Server-URL kommen aus Config/*.xcconfig (Platzhalter, siehe docs/apple.md).
name: MailPilot

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: de
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(MAILPILOT_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

packages:
  MailPilotKit:
    path: MailPilotKit

targets:
  # ---------------------------------------------------------------- iOS
  MailPilot-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "Support/**"
      - path: Shared
    dependencies:
      - package: MailPilotKit
        product: MailPilotKit
      - package: MailPilotKit
        product: MailPilotUI
      - target: MailPilotWidgets-iOS
      - target: MailPilotShare-iOS
    settings:
      base:
        PRODUCT_NAME: MailPilot
        PRODUCT_BUNDLE_IDENTIFIER: $(MAILPILOT_BUNDLE_ID)
        INFOPLIST_FILE: iOS/Support/Info.plist
        # Push optional: iOS/Support/MailPilot-Push.entitlements verwenden (aps-environment).
        CODE_SIGN_ENTITLEMENTS: iOS/Support/MailPilot.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MailPilotWidgets-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Support/**"
      - path: Shared
    dependencies:
      - package: MailPilotKit
        product: MailPilotKit
    settings:
      base:
        PRODUCT_NAME: MailPilotWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(MAILPILOT_BUNDLE_ID).widgets
        INFOPLIST_FILE: Widgets/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Support/Widgets-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  MailPilotShare-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
        excludes:
          - "Support/**"
    dependencies:
      - package: MailPilotKit
        product: MailPilotKit
    settings:
      base:
        PRODUCT_NAME: MailPilotShare
        PRODUCT_BUNDLE_IDENTIFIER: $(MAILPILOT_BUNDLE_ID).share
        INFOPLIST_FILE: Share/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/Support/Share-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # ---------------------------------------------------------------- macOS
  MailPilot-macOS:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes:
          - "Support/**"
      - path: Shared
    dependencies:
      - package: MailPilotKit
        product: MailPilotKit
      - package: MailPilotKit
        product: MailPilotUI
      - target: MailPilotWidgets-macOS
      - target: MailPilotShare-macOS
    settings:
      base:
        PRODUCT_NAME: MailPilot
        PRODUCT_BUNDLE_IDENTIFIER: $(MAILPILOT_BUNDLE_ID)
        INFOPLIST_FILE: macOS/Support/Info.plist
        # Push optional: macOS/Support/MailPilot-Push.entitlements verwenden (com.apple.developer.aps-environment).
        CODE_SIGN_ENTITLEMENTS: macOS/Support/MailPilot.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MailPilotWidgets-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes:
          - "Support/**"
      - path: Shared
    dependencies:
      - package: MailPilotKit
        product: MailPilotKit
    settings:
      base:
        PRODUCT_NAME: MailPilotWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(MAILPILOT_BUNDLE_ID).widgets
        INFOPLIST_FILE: Widgets/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Support/Widgets-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  MailPilotShare-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Share
        excludes:
          - "Support/**"
    dependencies:
      - package: MailPilotKit
        product: MailPilotKit
    settings:
      base:
        PRODUCT_NAME: MailPilotShare
        PRODUCT_BUNDLE_IDENTIFIER: $(MAILPILOT_BUNDLE_ID).share
        INFOPLIST_FILE: Share/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/Support/Share-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  MailPilot-iOS:
    build:
      targets:
        MailPilot-iOS: all
        MailPilotWidgets-iOS: all
        MailPilotShare-iOS: all
    run:
      config: Debug
    archive:
      config: Release

  MailPilot-macOS:
    build:
      targets:
        MailPilot-macOS: all
        MailPilotWidgets-macOS: all
        MailPilotShare-macOS: all
    run:
      config: Debug
    archive:
      config: Release
